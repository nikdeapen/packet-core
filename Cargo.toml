[package]
name = "packet-core"
version = "0.0.0"
description = "This library provides common ProtoPacket schema patterns."
readme = "README.md"
repository = "https://github.com/nikdeapen/packet-core"
homepage = "https://github.com/nikdeapen/packet-core"
authors = ["Nik Deapen <nik@deapen.com>"]
edition = "2024"
license = "MIT"

[dependencies]
proto-packet = "0.1.0-rc.11"
enc = { version = "0.19.0", features = ["var-int"] }

serde = { version = "1.0.228", features = ["derive"] }
